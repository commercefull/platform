---
# ===========================================
# Common Role - Base System Setup
# ===========================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [common, update]

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  when: upgrade_packages | default(false) | bool
  tags: [common, upgrade]

- name: Install base dependencies
  ansible.builtin.apt:
    name: '{{ common_packages }}'
    state: present
  tags: [common, packages]

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"
  tags: [common, timezone]

- name: Auto-remove unnecessary packages
  ansible.builtin.apt:
    autoremove: yes
    purge: yes
  tags: [common, cleanup]

# SECURITY: SSH hardening
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart SSH
  tags: [common, ssh, security]

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: Restart SSH
  tags: [common, ssh, security]

- name: Disable SSH empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitEmptyPasswords"
    line: "PermitEmptyPasswords no"
    state: present
  notify: Restart SSH
  tags: [common, ssh, security]

- name: Set SSH MaxAuthTries
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?MaxAuthTries"
    line: "MaxAuthTries 3"
    state: present
  notify: Restart SSH
  tags: [common, ssh, security]

- name: Disable SSH X11 and agent forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?{{ item.key }}\b'
    line: '{{ item.key }} {{ item.value }}'
    state: present
  loop:
    - { key: 'X11Forwarding', value: 'no' }
    - { key: 'AllowAgentForwarding', value: 'no' }
    - { key: 'LoginGraceTime', value: '30' }
  notify: Restart SSH
  tags: [common, ssh, security]

# SECURITY: automatic security patches + SSH brute-force banning
- name: Install security packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - fail2ban
    state: present
  tags: [common, security]

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'
  tags: [common, security]

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban
  tags: [common, security]

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes
  tags: [common, security]
