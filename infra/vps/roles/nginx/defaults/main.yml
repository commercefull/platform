---
# ===========================================
# Nginx Role - Default Variables
# ===========================================

domain_name: 'yourdomain.com'
ssl_cert_path: '/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem'
ssl_key_path: '/etc/letsencrypt/live/{{ domain_name }}/privkey.pem'
app_port: 3000

# Rate limiting
nginx_rate_limit: '10r/s'
nginx_rate_limit_burst: 20
# Credential endpoints (login/register/token/password reset)
nginx_auth_rate_limit: '5r/m'
nginx_auth_rate_limit_burst: 10
# Everything else
nginx_global_rate_limit: '20r/s'
nginx_global_rate_limit_burst: 100

# Client body size (for uploads)
nginx_client_max_body_size: '50M'
