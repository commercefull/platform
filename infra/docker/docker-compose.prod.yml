
# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:?BASE_URL must be set (e.g. https://shop.example.org)}
      - CRON_DISABLED=1
      - EVENT_CONSUMER_DISABLED=1
      - EVENT_BUS_PROVIDER=postgres
      - CACHE_BACKEND=redis
      - SESSION_BACKEND=redis
      - POSTGRES_APPLICATION_NAME=commercefull-web
      - METRICS_ENABLED=1
      - LOG_FILE_ENABLED=0
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["node", "./worker.mjs"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVENT_BUS_PROVIDER=postgres
      - CACHE_BACKEND=redis
      - SESSION_BACKEND=redis
      - POSTGRES_APPLICATION_NAME=commercefull-worker
      - METRICS_ENABLED=1
      - LOG_FILE_ENABLED=0
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../uploads:/app/public/uploads
    networks:
      - commercefull-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    ports: !reset []
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-commercefull}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-commercefull}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !reset []
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  commercefull-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
