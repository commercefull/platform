
services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: commercefull-app
    restart: unless-stopped
    ports:
      # Bind to loopback — expose publicly only through a TLS reverse proxy
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../uploads:/app/public/uploads
    networks:
      - commercefull-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: commercefull-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=commercefull
      # Local-dev default only; docker-compose.prod.yml requires POSTGRES_PASSWORD
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-commercefull_password}
      - POSTGRES_DB=commercefull
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - commercefull-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercefull -d commercefull"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: commercefull-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    networks:
      - commercefull-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-commercefull_redis_dev}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  commercefull-network:
    driver: bridge
