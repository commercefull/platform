name: commit-lint

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint PR commits
        run: yarn commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
