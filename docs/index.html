<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CommerceFull — e-commerce platform documentation">
  <title>CommerceFull Docs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.css">
  <style>
    :root {
      --docsify-base-color: #2563eb;
      --docsify-theme-color: #2563eb;
    }
    .app-name-link img { height: 40px; }
    .sidebar-nav .active { font-weight: 600; color: var(--docsify-theme-color); }
    .markdown-section code { background: #f1f5f9; border-radius: 3px; padding: 0.15em 0.35em; }
    .markdown-section pre { background: #1e293b; }
    .markdown-section pre > code { background: #1e293b; color: #e2e8f0; }
    table { display: table; width: 100%; overflow: hidden; }
    table th { background: #f8fafc; }
    table tr:nth-child(2n) { background: #f8fafc; }
    .badge { display: inline-block; padding: 0.2em 0.6em; border-radius: 3px; font-size: 0.85em; color: #fff; }
    .badge-get { background: #22c55e; }
    .badge-post { background: #3b82f6; }
    .badge-put { background: #f59e0b; }
    .badge-delete { background: #ef4444; }
    .badge-patch { background: #a855f7; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CommerceFull',
      repo: '',
      loadSidebar: true,
      maxLevel: 4,
      subMaxLevel: 3,
      coverpage: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3,
      },
      mermaid: {
        querySelector: '.mermaid',
      },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            return html;
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2"></script>
  <script type="module">
    import mermaid from '//cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
</body>
</html>
